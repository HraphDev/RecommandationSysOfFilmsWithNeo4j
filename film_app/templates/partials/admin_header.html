<!-- templates/partials/admin_header.html -->
<header class="header">
    <div class="container">
        <div class="row">
            <div class="col-lg-2">
                <div class="header__logo">
                    <a href="{% url 'admin_dashboard' %}">
                        <img src="{% static 'img/logo.png' %}" alt="FilmNeo Admin">
                    </a>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="header__nav">
                    <nav class="header__menu mobile-menu">
                        <ul>
                            <li><a href="{% url 'admin_dashboard' %}">Dashboard</a></li>
                            <li><a href="{% url 'admin_users' %}">Utilisateurs</a></li>
                            <li><a href="#">Films</a></li>
                            <li><a href="#">Statistiques</a></li>
                            <li><a href="{% url 'user_dashboard' %}">Site Public</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="col-lg-2">
                <div class="header__right">
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                            <img src="{{ user.get_profile_picture_url }}" 
                                 alt="{{ user.get_full_name }}"
                                 class="rounded-circle"
                                 width="30" height="30"
                                 style="object-fit: cover;">
                            <span class="text-white ml-2">{{ user.username }}</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="{% url 'profile' %}">
                                <i class="fa fa-user"></i> Mon Profil
                            </a>
                            <a class="dropdown-item" href="{% url 'user_dashboard' %}">
                                <i class="fa fa-eye"></i> Voir Site
                            </a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                                <i class="fa fa-sign-out"></i> Déconnexion
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="mobile-menu-wrap"></div>
    </div>
</header>
